name: proposal-poster

# Secrets (both on this fork):
#   CONTENT_PAT  — sadiib-side token with Contents R/W on sadiib/proposals
#                  (classic `repo`, or fine-grained scoped to that repo).
#                  Used ONLY for checking out the private content and pushing
#                  state back. Never used for upstream posting.
#   M00RISH_PAT  — M00rish classic PAT (`public_repo` suffices). Used ONLY to
#                  authenticate gh for upstream reads + posting. The job aborts
#                  unless gh resolves to M00rish (strict gate in post.sh).

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (default) or post"
        required: false
        default: "dry-run"
      issue_number:
        description: "Issue number (re-arm actions only)"
        required: false
        default: ""
      action:
        description: "none, re-arm-only, re-arm-and-post"
        required: false
        default: "none"
      proposal_body:
        description: "Proposal markdown (re-arm actions only)"
        required: false
        default: ""

# Serializes ticks so two runs can never evaluate/post concurrently.
concurrency:
  group: proposal-poster
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Check out private content
        uses: actions/checkout@v5
        with:
          repository: sadiib/proposals
          token: ${{ secrets.CONTENT_PAT }}
          path: content

      - name: Run poster
        working-directory: content
        env:
          # gh authenticates from GH_TOKEN directly (no `gh auth login`, whose
          # token validation demands scopes the posting token doesn't need).
          # post.sh's strict gate still proves the token resolves to M00rish.
          GH_TOKEN: ${{ secrets.M00RISH_PAT }}
          MODE: ${{ github.event.inputs.mode || vars.POSTER_MODE || 'dry-run' }}
          DISPATCH_ACTION: ${{ github.event.inputs.action || 'none' }}
          DISPATCH_ISSUE: ${{ github.event.inputs.issue_number || '' }}
          DISPATCH_BODY: ${{ github.event.inputs.proposal_body || '' }}
        run: ./proposal-bot/post.sh

      - name: Commit state back to private repo
        working-directory: content
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No state changes."
            exit 0
          fi
          git -c user.name="proposal-poster" -c user.email="proposal-poster@users.noreply.github.com" \
            commit -m "proposal-poster: update state $(date -u +%FT%TZ)"
          git push
